<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WePill</title>
<meta name="theme-color" content="#D0E9DD">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WePill">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: celular com aurora pastel ao fundo, cartões de vidro, anel de progresso, faixa da semana, barra de navegação flutuante e folhas que sobem de baixo */
:root{
  --bg:#D0E9DD; --glass:rgba(255,255,255,.74); --glass-2:rgba(255,255,255,.82); --stroke:rgba(255,255,255,.9); --hair:rgba(40,48,80,.08);
  --ink:#1E2335; --ink-2:#565C75; --ink-3:#6B7189;
  --a1:#4CC29E; --a2:#8FE3CF; --a3:#FFC3A8; --a4:#A9D4FF;
  --mint:#D6F5EC; --mint-ink:#1F8A6E; --lav:#E6E0FF; --lav-ink:#5B48C9; --peach:#FFE5D9; --peach-ink:#C0582F;
  --sky:#DCEBFF; --sky-ink:#28609F; --butter:#FFF3C9; --butter-ink:#7A6114; --rose:#FFDDE4; --rose-ink:#C23A58;
  --accent:#1F9A78; --accent-2:#5FD3B6; --accent-ink:#FFFFFF; --accent-text:#17775C; --glow:rgba(31,154,120,.35);
  --shadow:0 1px 1px rgba(30,35,60,.04),0 12px 32px -8px rgba(30,35,60,.14); --aurora-op:0;
  --font-display:"Sora",system-ui,sans-serif; --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,.8,.3,1); --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1916; --glass:rgba(30,46,42,.72); --glass-2:rgba(38,58,53,.9); --stroke:rgba(255,255,255,.08); --hair:rgba(255,255,255,.07);
  --ink:#EDEFFA; --ink-2:#A3A9C6; --ink-3:#9096B4;
  --a1:#2FB896; --a2:#1E8F7A; --a3:#B2563A; --a4:#2C5FA8;
  --mint:#173A35; --mint-ink:#8CEBCF; --lav:#29244D; --lav-ink:#C4B9FF; --peach:#40261D; --peach-ink:#FFB894;
  --sky:#1A2F4D; --sky-ink:#9CC8FF; --butter:#3A3218; --butter-ink:#F3D886; --rose:#42202B; --rose-ink:#FF9DB2;
  --accent:#3CC39C; --accent-2:#9BEBD6; --accent-ink:#06231B; --accent-text:#3CC39C; --glow:rgba(60,195,156,.35);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.5); --aurora-op:0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1916; --glass:rgba(30,46,42,.72); --glass-2:rgba(38,58,53,.9); --stroke:rgba(255,255,255,.08); --hair:rgba(255,255,255,.07);
  --ink:#EDEFFA; --ink-2:#A3A9C6; --ink-3:#9096B4;
  --a1:#2FB896; --a2:#1E8F7A; --a3:#B2563A; --a4:#2C5FA8;
  --mint:#173A35; --mint-ink:#8CEBCF; --lav:#29244D; --lav-ink:#C4B9FF; --peach:#40261D; --peach-ink:#FFB894;
  --sky:#1A2F4D; --sky-ink:#9CC8FF; --butter:#3A3218; --butter-ink:#F3D886; --rose:#42202B; --rose-ink:#FF9DB2;
  --accent:#3CC39C; --accent-2:#9BEBD6; --accent-ink:#06231B; --accent-text:#3CC39C; --glow:rgba(60,195,156,.35);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 12px 32px -8px rgba(0,0,0,.5); --aurora-op:0; color-scheme:dark}

html,body{height:100%;margin:0} /* v89: sem a margem padrão de 8px (bordas escuras no iPhone) */
html,body{overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation} /* v90: sem zoom por toque duplo e sem rolagem lateral */
@media (max-width:480px){input,select,textarea{font-size:16px!important}} /* v90: iPhone dá zoom sozinho em campos com letra menor que 16px */
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;transition:background-color .5s var(--ease),color .5s var(--ease);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}

.phone{position:relative;max-width:420px;height:100%;max-height:900px;margin:0 auto;background:var(--bg);border-radius:40px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px -20px rgba(30,35,60,.35),0 0 0 1px var(--hair);isolation:isolate;transition:background-color .5s var(--ease)}
/* fora do celular: aparelho de 390x844 (9:19,5) reduzido por escala para caber, sem distorcer */
@media (min-width:481px){body{overflow:hidden;display:flex;justify-content:center;align-items:flex-start}.phone{flex:none;width:390px;height:844px;max-height:none;margin:0;transform-origin:top center}}
@media (max-width:480px){body{padding:0}.phone{border-radius:0;max-height:none;max-width:none;box-shadow:none;width:100%;padding-top:env(safe-area-inset-top,0px)}} /* v89: tela inteira no celular, inclusive atrás da barra de status */
@media (max-width:480px){body .phone nav.dock{left:0;right:0;bottom:0;border-radius:24px 24px 0 0;padding:8px 10px calc(6px + env(safe-area-inset-bottom,0px));border-bottom:0}} /* v91: barra de baixo colada no fim da tela, sem faixa verde embaixo */
.aurora{position:absolute;inset:-20%;z-index:-1;opacity:var(--aurora-op);filter:blur(50px);pointer-events:none;transition:opacity .6s}
.aurora i{position:absolute;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60%;height:40%;left:5%;top:2%;background:var(--a1)}
.aurora i:nth-child(2){width:55%;height:38%;right:0;top:22%;background:var(--a2);animation-duration:22s}
.aurora i:nth-child(3){width:50%;height:35%;left:10%;bottom:8%;background:var(--a3);animation-duration:26s;opacity:.7}
.aurora i:nth-child(4){width:45%;height:30%;right:5%;bottom:0;background:var(--a4);animation-duration:20s}
@keyframes drift{to{transform:translate(6%,4%) scale(1.08)}}

.glass{background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:var(--shadow);border-radius:var(--r)}
.tap{transition:transform .2s var(--ease),background-color .3s,box-shadow .3s}
.tap:active{transform:scale(.96)}

header.top{padding:20px 22px 6px;display:flex;align-items:center;gap:12px}
.hello{flex:1;min-width:0}
.inner .hello small{display:none}.inner .hello b{font-size:28px;font-weight:700}
.hello small{color:var(--ink-2);font-size:13px;display:block}
.hello b{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.02em}
.round{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.round svg{width:20px;height:20px}
.avatar{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-family:var(--font-display);font-weight:600;font-size:14px}
.theme svg{transition:transform .6s var(--ease)}
.theme:active svg{transform:rotate(180deg)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 104px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:16px;animation:enter .5s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.stagger>*{animation:rise .55s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}.stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--font-display);font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:6px 2px -6px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--hair)}
.sub{color:var(--ink-2);margin:0}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:5px;border-radius:18px}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:12px;transition:all .35s var(--ease)}
.day small{font-size:9.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.day b{font-family:var(--font-display);font-weight:500;font-size:13px;line-height:1.2}
.day i{width:4px!important;height:4px!important}
.day i{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.day i.full{background:var(--accent-2)} .day i.none{background:transparent}
.day.on{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent-2)));color:var(--accent-ink);box-shadow:0 8px 20px -6px var(--glow)}
.day.on small{color:inherit;opacity:.85}.day.on i{background:currentColor}

/* hero */
.hero{padding:14px 16px;display:flex;gap:16px;align-items:center}
.ring{position:relative;width:100px;height:100px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--hair)}
.ring .bar{stroke:url(#grad);transition:stroke-dashoffset 1s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font-family:var(--font-display);font-size:28px;font-weight:600;line-height:1}
.ring .mid small{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.next{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-family:var(--font-display)}
.next .nm{font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.25}
.nmlink{background:none;border:0;padding:0;margin:0;color:inherit;text-align:left;cursor:pointer;display:block}.nmpen{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--ink-3);opacity:.8}.nmpen svg{width:15px;height:15px}
.countdown{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent-text,var(--accent));font-weight:600}
.countdown::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--glow);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.btn{border-radius:16px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),box-shadow .3s,filter .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2)));color:var(--accent-ink);box-shadow:0 10px 24px -8px var(--glow)}
.btn.ghost{background:var(--glass-2);border:1px solid var(--stroke);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.btn.block{width:100%}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.mini b{font-family:var(--font-display);font-size:22px;font-weight:600;line-height:1.1}
.mini small{font-size:12px;color:var(--ink-2);line-height:1.3}
.mini.warn b{color:var(--peach-ink)} .mini.ok b{color:var(--mint-ink)}

/* doses */
.dose{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;transition:transform .3s var(--ease),opacity .4s}
.dose.done{opacity:.6}
.pillic{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--c);color:var(--ci);position:relative;overflow:hidden}
.pillic svg{width:26px;height:26px}
.pillic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dose .info{flex:1;min-width:0}
.dose .info b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dose .meta{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bell{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:var(--glass-2);border:1px solid var(--stroke);font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bell svg{width:13px;height:13px}
.bell.off{color:var(--ink-3)}
.take{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;border:1.5px solid var(--hair);background:var(--glass-2);flex:none;transition:all .35s var(--ease)}
.take svg{width:20px;height:20px;opacity:.35;transition:all .35s var(--ease)}
.take.on{background:linear-gradient(135deg,var(--accent-2),color-mix(in srgb,var(--accent-2) 60%,var(--accent)));border-color:transparent;color:#fff;box-shadow:0 8px 18px -6px var(--accent-2)}
.take.on svg{opacity:1;transform:scale(1.1)}
.dose .info b s{text-decoration-color:var(--ink-3)}

.c-remedio{--c:var(--sky);--ci:var(--sky-ink)} .c-suplemento{--c:var(--mint);--ci:var(--mint-ink)}
.c-vitamina{--c:var(--butter);--ci:var(--butter-ink)} .c-fito{--c:var(--lav);--ci:var(--lav-ink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--c);color:var(--ci)}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:12px 14px;width:100%;text-align:left}
.item .info{flex:1;min-width:0}
.item .info b{font-weight:700;display:block}
.item .info span{font-size:13px;color:var(--ink-2)}
.flag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sevbg);color:var(--sev);flex:none}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;scroll-snap-type:x proximity}
.filters .filter{scroll-snap-align:center}
#swlist{touch-action:pan-y;will-change:transform}
.swin-r{animation:swR .38s var(--ease)}.swin-l{animation:swL .38s var(--ease)}
@keyframes swR{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
@keyframes swL{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
.swdots{display:flex;justify-content:center;gap:6px;margin-top:2px}.swdots i{width:6px;height:6px;border-radius:9px;background:var(--hair);transition:all .3s var(--ease)}.swdots i.on{width:18px;background:var(--ink-2)}
.swhint{text-align:center;font-size:12px;color:var(--ink-3,var(--ink-2));opacity:.8;margin-top:-4px}
.filter{padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--glass);border:1px solid var(--stroke);color:var(--ink-2);transition:all .3s var(--ease)}
.filter.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.alert{padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:var(--sevbg);filter:blur(10px);opacity:.9;z-index:-1}
.sev-alergia{--sev:var(--rose-ink);--sevbg:var(--rose)} .sev-grave{--sev:var(--rose-ink);--sevbg:var(--rose)} .sev-moderada{--sev:var(--peach-ink);--sevbg:var(--peach)} .sev-leve{--sev:var(--butter-ink);--sevbg:var(--butter)}
.sevpill{align-self:flex-start;background:var(--sevbg);color:var(--sev);padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.alert h3{margin:0;font-family:var(--font-display);font-size:16px;font-weight:600}
.alert p{margin:0;font-size:14px;color:var(--ink-2)}
.todo{background:var(--glass-2);border:1px solid var(--stroke);border-radius:14px;padding:10px 12px;font-size:14px;display:flex;gap:8px}
.todo svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--mint-ink)}
.src{font-size:12px;color:var(--ink-3)}
.new{animation:pop .7s var(--ease)}
@keyframes pop{0%{transform:scale(.94);opacity:0}60%{transform:scale(1.015);opacity:1}100%{transform:none}}

.pro{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--font-display);font-size:14px}
.pro .info{flex:1;min-width:0}
.pro .info b{font-weight:700;display:block}
.pro .info span{font-size:13px;color:var(--ink-2)}
.switch{width:48px;height:28px;border-radius:99px;background:var(--hair);position:relative;flex:none;transition:background .35s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))} .switch.on::after{transform:translateX(20px)}
.note{display:flex;gap:10px;font-size:14px}
.bubble{background:var(--glass-2);border:1px solid var(--stroke);border-radius:6px 16px 16px 16px;padding:10px 12px;flex:1}
.bubble small{display:block;color:var(--ink-2);font-size:12px;margin-bottom:2px}

/* navegação flutuante */
nav.dock{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;padding:8px;align-items:center;padding:8px;border-radius:26px;z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;letter-spacing:-.01em;white-space:nowrap;font-weight:600;color:var(--ink-3);padding:6px 0;position:relative;transition:color .3s}
.tab svg{width:22px;height:22px;transition:transform .35s var(--ease)}
.tab.on{color:var(--accent-text,var(--accent))} .tab.on svg{transform:translateY(-2px)}
.tab.on::after{content:"";position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.tab .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--peach-ink);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.fab{width:56px;height:56px;border-radius:20px;margin:-26px auto 0;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 12px 28px -8px var(--glow),0 0 0 6px var(--bg);transition:transform .35s var(--ease)}
.fab svg{width:26px;height:26px;transition:transform .35s var(--ease)}
.fab:hover svg{transform:rotate(90deg)} .fab:active{transform:scale(.92)}

/* folhas */
.scrim{position:absolute;inset:0;background:rgba(10,12,25,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s var(--ease);z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--glass-2);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--stroke);border-radius:32px 32px 0 0;z-index:11;transform:translateY(calc(100% + 60px));transition:transform .5s var(--ease);display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet-body>*{flex-shrink:0}
.grab{width:42px;height:5px;border-radius:3px;background:var(--ink-3);opacity:.5;margin:10px auto 4px;flex:none}
.sheet-body{overflow-y:auto;padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h1{margin-top:0;font-size:23px}
.search{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:6px 6px 6px 14px}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);flex:1;outline:none;min-width:0;padding:6px 0}
.search>svg{width:20px;height:20px;color:var(--ink-2);flex:none}
.cambtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;flex:none}
.cambtn svg{width:20px;height:20px}
.scan{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.scan .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--lav);color:var(--lav-ink);flex:none;position:relative;overflow:hidden}
.scan .ic svg{width:22px;height:22px}
.scan .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan.reading .ic::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);animation:scanline 1s linear infinite}
@keyframes scanline{from{top:0}to{top:100%}}
.result{display:flex;align-items:center;gap:12px;padding:10px 4px;width:100%;text-align:left;border-bottom:1px solid var(--hair)}
.result:disabled{opacity:.55;cursor:default}
.result .info{flex:1;min-width:0}.result .info span{font-size:13px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:1fr;gap:10px}
.fact{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;padding:12px 14px}
.fact small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin-bottom:2px;font-family:var(--font-display)}
.photo-slot{display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke)}
.photo-slot .thumb{width:64px;height:64px;border-radius:16px;background:var(--c);color:var(--ci);display:grid;place-items:center;overflow:hidden;flex:none}
.photo-slot .thumb img{width:100%;height:100%;object-fit:cover}
.photo-slot .thumb svg{width:28px;height:28px}
.disclaimer{font-size:12px;color:var(--ink-3);text-align:center;margin:2px 0 0}

/* alarme */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke)}
.field label,.field span.lbl{font-weight:600}
.field small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px}
.timebig{font-family:var(--font-display);font-size:44px;font-weight:300;letter-spacing:-.02em;background:transparent;border:0;color:var(--ink);text-align:center;width:100%;padding:0;font-variant-numeric:tabular-nums}
.timebox{padding:18px;border-radius:22px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,transparent),color-mix(in srgb,var(--accent-2) 14%,transparent));border:1px solid var(--stroke)}
.timebox small{color:var(--ink-2);font-size:12.5px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{aspect-ratio:1;max-width:100%;border-radius:12px;font-weight:700;font-size:13px;background:var(--glass);border:1px solid var(--stroke);color:var(--ink-3);transition:all .3s var(--ease)}
.dchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--glass);border:1px solid var(--stroke)}
.seg button{padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);transition:all .3s var(--ease)}
.seg button.on{background:var(--glass-2);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}

.ring-alarm{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px 24px;text-align:center;
  background:radial-gradient(120% 80% at 50% 20%,color-mix(in srgb,var(--accent) 45%,var(--bg)),var(--bg));opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.ring-alarm.on{opacity:1;pointer-events:auto}
.pulse{position:relative;width:132px;height:132px;display:grid;place-items:center}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:waves 2.2s var(--ease) infinite}
.pulse::after{animation-delay:1.1s}
@keyframes waves{from{transform:scale(.7);opacity:.9}to{transform:scale(1.5);opacity:0}}
.pulse .core{width:96px;height:96px;border-radius:32px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 20px 40px -10px var(--glow);animation:wig 1.2s ease-in-out infinite}
.pulse .core svg{width:44px;height:44px}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(0)}}
.ring-alarm .clock{font-family:var(--font-display);font-size:56px;font-weight:300;letter-spacing:-.03em;line-height:1}
.ring-alarm .row{display:flex;gap:10px;width:100%;max-width:320px}
.ring-alarm .row .btn{flex:1}

.toast{position:absolute;left:16px;right:16px;top:14px;border-radius:18px;padding:12px 16px;font-size:14px;z-index:40;transform:translateY(-200%);opacity:0;transition:transform .5s var(--ease),opacity .3s;display:flex;gap:10px;align-items:center;font-weight:500}
.toast.on{transform:none;opacity:1}
.toast svg{width:18px;height:18px;color:var(--accent);flex:none}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep td{padding:9px 4px;border-bottom:1px solid var(--hair);vertical-align:top}
table.rep.bytime td.hr{font-family:'Sora',sans-serif;font-weight:700;color:var(--ink);width:58px;font-variant-numeric:tabular-nums}
table.rep:not(.bytime) td:last-child{text-align:right;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.qr{width:132px;height:132px;border-radius:20px;background:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:var(--shadow)}


/* ficha de saúde */
.idcard{display:flex;align-items:stretch;gap:10px}
.blood{flex:none;width:76px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:var(--rose);color:var(--rose-ink);border:1px solid var(--stroke);padding:8px 4px}
.blood svg{width:16px;height:16px}
.blood b{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.blood small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.allergy{flex:1;min-width:0;border-radius:20px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:left}
.allergy small{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.allergy .tags{display:flex;flex-wrap:wrap;gap:6px}
.atag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--rose);color:var(--rose-ink)}
.atag svg{width:13px;height:13px}
.allergy .warn{font-size:12px;font-weight:700;color:var(--rose-ink)}
.alert.allergic{border:1.5px solid var(--rose-ink)}
.idmini{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
/* cartela */
.box{padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);display:flex;flex-direction:column;gap:10px}
.box .lineh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meter{height:10px;border-radius:9px;background:var(--hair);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s var(--ease)}
.meter.low i{background:linear-gradient(90deg,var(--peach-ink),var(--rose-ink))}
.meter::after{content:"";position:absolute;top:-2px;bottom:-2px;left:80%;width:2px;background:var(--ink-3);border-radius:2px}
.refill{display:flex;gap:10px;align-items:center;padding:8px 14px;border-radius:16px;font-size:13px;line-height:1.3;background:var(--peach);color:var(--peach-ink);border:1px solid var(--stroke);text-align:left;width:100%}
.refill svg{width:20px;height:20px;flex:none}
.refill b{display:block;color:var(--ink);font-weight:700}
.refill span{font-size:12.5px}
.mbar{height:4px;border-radius:4px;background:var(--hair);overflow:hidden;margin-top:6px;max-width:160px}
.mbar i{display:block;height:100%;background:var(--accent-2)}
.mbar.low i{background:var(--peach-ink)}

/* v5 */
.weekbar{padding:2px 18px 8px}
.day{cursor:pointer;border:0;background:none;color:inherit;font:inherit}
.day.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
.day:not(.on):hover{background:var(--glass-2)}
.dayview{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--sky);color:var(--sky-ink);font-size:13.5px;font-weight:600}
.dayview button{margin-left:auto;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.take[disabled]{cursor:default}
.sev-repor{--sev:var(--sky-ink);--sevbg:var(--sky)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.afilter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:16px}
.afilter button{padding:8px 2px;border-radius:12px;font-size:12px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:0;transition:all .3s var(--ease)}
.afilter button b{font-family:var(--font-display);font-size:16px;line-height:1.2}
.afilter button.on{background:var(--glass-2);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.nextacts{display:flex;gap:8px;align-items:center;margin-top:4px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--stroke);flex:none}
.iconbtn svg{width:18px;height:18px}
/* alergia: contorno neon pulsante, sem cor chapada */
:root{--neon:#C21E5A;--neon-soft:rgba(224,48,111,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--neon:#FF6FA8;--neon-soft:rgba(255,111,168,.45)}}
:root[data-theme="dark"]{--neon:#FF6FA8;--neon-soft:rgba(255,111,168,.45)}
@keyframes neon{0%,100%{box-shadow:0 0 0 1px var(--neon),0 0 6px 0 var(--neon-soft)}50%{box-shadow:0 0 0 1px var(--neon),0 0 18px 3px var(--neon-soft)}}
.allergy{border:1px solid transparent;animation:neon 2.6s ease-in-out infinite}
.allergy small{color:var(--neon);font-size:11px}
.atag{background:transparent;border:1.5px solid var(--neon);color:var(--neon);font-size:13.5px;padding:3px 12px;letter-spacing:.01em}
.allergy .warn{color:var(--ink);font-size:12.5px;display:flex;gap:6px;align-items:flex-start}
.allergy .warn svg{width:15px;height:15px;color:var(--neon);flex:none;margin-top:1px}
.blood{background:var(--glass);color:var(--ink);border:1px solid var(--stroke);box-shadow:var(--shadow)}
.blood svg{color:var(--neon)}
.blood small{color:var(--ink-2)}
.blood b{font-size:26px}
.alert.allergic{border:1px solid transparent;animation:neon 2.6s ease-in-out infinite}
.alert.allergic::before{display:none}
.alert.allergic .sevpill{background:transparent;border:1.5px solid var(--neon);color:var(--neon)}
.flag.sev-alergia{background:transparent;border:1.5px solid var(--neon);color:var(--neon)}
@media (prefers-reduced-motion:reduce){.allergy,.alert.allergic{box-shadow:0 0 0 1.5px var(--neon)}}

/* menos cor no painel: números neutros, cor só como sinal */
.mini.warn b,.mini.ok b{color:var(--ink)}
.mini.warn small{display:flex;gap:6px;align-items:baseline}
.mini.warn small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--peach-ink);flex:none;transform:translateY(-1px)}
.period{background:linear-gradient(180deg,var(--pc),var(--glass) 75%)}

/* encaixe mobile: o painel cabe na tela sem rolar */
header.top{padding:14px 18px 6px;gap:8px}
.round{width:40px;height:40px}
.view{gap:12px}
.idcard .allergy{padding:8px 12px}
.blood{width:70px;padding:6px 4px}
.hero{padding:12px 14px}
.ring{width:92px;height:92px}
.ring .mid b{font-size:24px}
.mini{padding:10px 12px}
.period{padding:12px 10px 10px;gap:4px}
h2{margin-top:2px}
.h780 header.top{padding:10px 16px 4px}.h780 .hello b{font-size:19px}.h780 .hello small{font-size:12px}.h780 .weekbar{padding:0 16px 6px}.h780 .day{padding:2px 0}.h780 main{padding:2px 16px 96px}.h780 .view{gap:10px}.h780 .blood b{font-size:22px}.h780 .atag{font-size:12.5px;padding:2px 10px}.h780 .allergy .warn{font-size:11.5px}.h780 .ring{width:78px;height:78px}.h780 .ring .mid b{font-size:20px}.h780 .ring .mid small{font-size:10px}.h780 .next .nm{font-size:15px}.h780 .countdown{font-size:12px}.h780 .btn.sm{padding:7px 12px}.h780 .iconbtn{width:34px;height:34px}.h780 .mini{padding:8px 10px}.h780 .mini b{font-size:19px}.h780 .mini small{font-size:11px}.h780 .period{padding:10px 10px 8px;border-radius:18px}.h780 .period svg{width:22px;height:22px}.h780 .period b{font-size:14px}.h780 .period small{font-size:11px}.h780 nav.dock{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px}.h780 .fab{width:52px;height:52px}

.h690 .hello small{display:none}.h690 .allergy .warn{display:none}.h690 .hero{padding:8px 12px}.h690 .ring{width:68px;height:68px}.h690 .ring .mid small{display:none}.h690 .eyebrow{font-size:10px}.h690 .mini small{font-size:10.5px}.h690 h2{display:none}.h690 .period .bar{display:none}


.view.home{min-height:100%}
/* v31: painel sempre acima da barra do menu, inclusive no app instalado (área segura do iPhone) */
main{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))!important}
.h780 main{padding-bottom:calc(98px + env(safe-area-inset-bottom,0px))!important}
.view.home .periods{flex:1;max-height:220px}

/* v9: anel com rótulo embaixo */
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.ringlbl{font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.h690 .ringlbl{font-size:11px}
/* v9: turnos centralizados */
.period{align-items:center;text-align:center}
.period .bar{width:100%}
.period.now::after{position:static;order:-1;margin-bottom:2px}
.view.home .periods .period{justify-content:center}
/* v9: ficha de emergência (tela de bloqueio) */
.sos{position:absolute;inset:0;z-index:34;display:flex;flex-direction:column;gap:12px;padding:26px 20px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;
  background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--accent) 30%,var(--bg)),var(--bg) 70%);transition:opacity .5s var(--ease),transform .6s var(--ease)}
.sos.off{opacity:0;transform:translateY(-6%) scale(.98);pointer-events:none}
.sos .clock{font-family:var(--font-display);font-weight:300;font-size:58px;letter-spacing:-.03em;line-height:1;text-align:center;margin-top:4px}
.sos .date{text-align:center;color:var(--ink-2);font-weight:600;margin-top:-4px}
.medid{padding:16px;display:flex;flex-direction:column;gap:12px;animation:neon 2.6s ease-in-out infinite;border:1px solid transparent}
.medid .ttl{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.medid .ttl svg{width:18px;height:18px}
.medid .who{display:flex;align-items:center;gap:12px}
.medid .who b{font-family:var(--font-display);font-size:18px;font-weight:600;display:block}
.medid .who span{font-size:13px;color:var(--ink-2)}
.bigblood{margin-left:auto;text-align:center;padding:6px 12px;border-radius:16px;border:1.5px solid var(--neon)}
.bigblood b{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1;color:var(--ink)}
.bigblood small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--neon)}
.mrow{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:13.5px;padding-top:10px;border-top:1px solid var(--hair)}
.mrow>span:first-child{color:var(--ink-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.mrow b{font-weight:700}
.sosacts{display:flex;gap:10px;margin-top:auto}
.sosacts .btn{flex:1}
.call{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:16px;border:1.5px solid var(--neon);color:var(--neon);font-weight:700;user-select:all}
.call svg{width:18px;height:18px}
.sosnote{font-size:11.5px;color:var(--ink-3);text-align:center;margin:0}

/* v10: conversas da equipe */
.pros-mini{display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.threads{display:flex;flex-direction:column;gap:10px}
.thread{display:flex;gap:12px;align-items:center;padding:12px 14px;width:100%;text-align:left}
.thread .info{flex:1;min-width:0}
.thread .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.thread .top b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .top small{font-size:11.5px;color:var(--ink-3);flex:none}
.thread .prev{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ctxic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ctxic svg{width:20px;height:20px}
.ctx-alerta{background:var(--peach);color:var(--peach-ink)} .ctx-item{background:var(--sky);color:var(--sky-ink)} .ctx-geral{background:var(--lav);color:var(--lav-ink)}
.unread{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pending{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:2px 8px;border-radius:99px;flex:none}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .av{width:30px;height:30px;border-radius:10px;font-size:11px}
.msg .bub{background:var(--glass);border:1px solid var(--stroke);border-radius:16px 16px 16px 6px;padding:9px 12px;font-size:14px}
.msg .bub small{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:2px}
.msg .bub .tipo{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--accent-2)));color:var(--accent-ink);border-color:transparent;border-radius:16px 16px 6px 16px}
.msg.me .bub small,.msg.me .bub .tipo{color:inherit;opacity:.85}
.sys{align-self:center;font-size:12px;color:var(--ink-2);background:var(--glass);border:1px solid var(--stroke);padding:4px 12px;border-radius:99px;text-align:center}
.sug{margin-top:8px;padding:10px;border-radius:12px;background:var(--glass-2);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);display:flex;flex-direction:column;gap:8px}
.sug .chg{display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.sug .chg svg{width:16px;height:16px;flex:none;color:var(--accent)}
.sug .chg s{color:var(--ink-3);font-weight:500}
.sug .acts{display:flex;gap:6px}
.sug .acts .btn{flex:1}
.sug .st{font-size:12.5px;font-weight:700;color:var(--mint-ink)}
.sug .st.no{color:var(--ink-3)}
.typing{align-self:flex-start;font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:sticky;bottom:-28px;margin:4px -20px -28px;padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass-2);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.ctypes{display:flex;gap:6px}

.splash .sp-iris{position:absolute;inset:0}.splash.v-c .sp-iris{animation:spIris .8s var(--ease) both}.splash.v-c .sp-bot{animation:spUp .6s .6s var(--ease) both}

    <div style="display:flex">${people.map((p,i)=>`<div style="margin-left:${i?-8:0}px">${avatar(p,30)}</div>`).join('')}</div></div>

function msgHtml(t,m,i){
  if(m.de==='sys')return `<div class="sys">${m.txt}</div>`;
  const me=m.de==='me',p=me?null:proOf(m.de);
  let sug='';if(m.sug){const g=m.sug,[id]=g.key.split('#'),A=alarm(g.key),own=g.owner&&g.owner!==m.de,oname=g.owner?proOf(g.owner).nome.split(' ').slice(0,2).join(' '):'',sname=proOf(m.de).nome.split(' ')[0];
    const steps=own?`<div class="steps"><span class="ok">${IC.check} Sugerido por ${sname}</span><span class="${g.approvedBy?'ok':'wait'}">${g.approvedBy?IC.check:'<i></i>'} ${g.approvedBy?'Aprovado por '+oname:'Aguardando '+oname+' (quem prescreveu)'}</span><span class="${g.status==='aceita'?'ok':g.status==='pendente'?'wait':''}">${g.status==='aceita'?IC.check:'<i></i>'} Sua confirmação</span></div>`:`<span class="own">${sname} prescreveu este item e pode sugerir direto</span>`;
    const act=g.status==='aguardando'?`<button class="btn ghost sm tap" data-sugappr="${t.id}:${i}">Simular: ${oname} aprovou</button>`:g.status==='pendente'?`<div class="acts"><button class="btn primary sm tap" data-sugok="${t.id}:${i}">Aceitar</button><button class="btn ghost sm tap" data-sugno="${t.id}:${i}">Recusar</button></div>`:`<span class="st ${g.status==='aceita'?'':'no'}">${g.status==='aceita'?'Você confirmou. A medicação foi alterada.':'Você recusou esta sugestão.'}</span>`;
    sug=`<div class="sug"><span class="chg">${IC.bell} ${DB[id].nome}: <s>${g.from||A.time}</s> → ${g.time}</span>${steps}${act}</div>`}

  return `<div class="msg ${me?'me':''}">${me?'':avatar(m.de,30)}<div class="bub" data-read="${t.id}:${i}" role="button" tabindex="0" aria-label="Ampliar e ouvir a mensagem"><small>${me?'Você':p.nome.split(' ').slice(0,2).join(' ')} · ${m.quando}</small>${m.tipo?`<span class="tipo">${m.tipo}</span><br>`:''}${esc(m.txt)}${me?'':`<span class="zoomhint">${IC.speaker} Toque para ampliar e ouvir</span>`}${sug}</div></div>`}

let RZ=1,RATE=1.2,READTXT='',speaking=false;
function fala(h){const [a,b]=h.split(':').map(Number);return b?`${a} e ${b}`:`${a} horas`}
function speakText(m){const who=m.de==='me'?'Você':proOf(m.de).nome;let x=m.de==='me'?`Sua mensagem: ${m.txt}`:`Mensagem de ${who}. ${m.txt}`;
  if(m.sug){const [id]=m.sug.key.split('#');x+=` A sugestão é tomar ${DB[id].nome} às ${fala(m.sug.time)}, em vez de ${fala(m.sug.from||alarm(m.sug.key).time)}.`}return norm(x)}
/* deixa a fala natural: abreviações, unidades e horários por extenso */
function norm(t){return t.replace(/\bDra\.\s?/g,'Doutora ').replace(/\bDr\.\s?/g,'Doutor ').replace(/(\d+)\s?mg\b/gi,'$1 miligramas').replace(/(\d+)\s?mcg\b/gi,'$1 microgramas').replace(/(\d+)\s?UI\b/g,'$1 unidades').replace(/\b(\d{1,2}):(\d{2})\b/g,(m,a,b)=>fala(a+':'+b)).replace(/(\d{1,2})h(\d{2})?\b/g,(m,a,b)=>fala(a+':'+(b||'00'))).replace(/\be\/ou\b/g,'e ou').replace(/\s+/g,' ').trim()}
function openReader(m,ref){READTXT=speakText(m);const who=m.de==='me'?'Você':proOf(m.de).nome;
  $('#reader').innerHTML=`<div class="rtop">${m.de==='me'?'':avatar(m.de,48)}<div class="who"><b>${who}</b><span>${m.quando}</span></div><button class="close tap" data-rclose aria-label="Fechar">${IC.close}</button></div>

  <div class="rspeed"><div class="seg"><button class="${RATE===1.2?'on':''}" data-rate="1.2">Voz normal</button><button class="${RATE===.95?'on':''}" data-rate="0.95">Voz devagar</button></div></div>
  <div class="rctrl"><div class="size"><button class="tap" data-rz="-0.15" aria-label="Diminuir letra">A-</button><button class="tap" data-rz="0.15" aria-label="Aumentar letra">A+</button></div>
    <button class="listen tap" id="listen" data-listen>${IC.speaker}<span>Ouvir mensagem</span><span class="wave"><i></i><i></i><i></i><i></i></span></button></div>`;
  $('#reader').style.setProperty('--rz',RZ);$('#reader').classList.add('on')}
function closeReader(){stopSpeak();$('#reader').classList.remove('on')}
/* escolhe a voz mais natural disponível: neural/online/premium primeiro */
function bestVoice(){let vs=[];try{vs=speechSynthesis.getVoices().filter(v=>/pt[-_]BR/i.test(v.lang))}catch(e){}
  const score=v=>(/natural|neural|online/i.test(v.name)?6:0)+(/premium|enhanced|aprimorad/i.test(v.name)?5:0)+(/google/i.test(v.name)?7:0)+(/francisca|thalita|luciana|felipe|antonio/i.test(v.name)?3:0)+(v.localService?0:1);
  return vs.sort((a,b)=>score(b)-score(a))[0]||null}
let VOICE=null;function loadVoice(){VOICE=bestVoice()}try{loadVoice();speechSynthesis.addEventListener?.('voiceschanged',loadVoice)}catch(e){}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false;const b=$('#listen');if(b){b.classList.remove('playing');b.querySelector('span').textContent='Ouvir mensagem'}}
function toggleSpeak(){if(speaking)return stopSpeak();
  if(!('speechSynthesis' in window)){return toast('O áudio não está disponível neste navegador. No app instalado, a leitura em voz alta é do próprio celular.')}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(READTXT);u.lang='pt-BR';const v=VOICE||bestVoice();if(v)u.voice=v;const net=v&&!v.localService;u.rate=net?RATE*.92:RATE;u.pitch=1;u.volume=1;
    u.onend=u.onerror=()=>stopSpeak();speechSynthesis.speak(u);speaking=true;const b=$('#listen');if(b){b.classList.add('playing');b.querySelector('span').textContent='Parar'}}catch(e){toast('Não consegui tocar o áudio agora.')}}
