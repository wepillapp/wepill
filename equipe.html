<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>WePill · Equipe</title>
<link rel="icon" href="icon-32.png">
<style>
:root{--bg:#D0E9DD;--card:#F4FAF7;--ink:#13221C;--ink-2:#4F6159;--line:#BFD9CC;--accent:#1F9C78;--accent-ink:#fff;--rose:#C23A58;--sky:#DCEBFF;--sky-ink:#28609F}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A16;--card:#18251F;--ink:#E8F3EE;--ink-2:#9DB3AA;--line:#2A3D35;--accent:#3CC79E;--accent-ink:#06140F;--rose:#FF9DB2;--sky:#1A2F4D;--sky-ink:#9CC8FF}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0 2px}h2{font-size:18px;margin:22px 0 8px}
.sub{color:var(--ink-2);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{flex:1}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.on,button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.del{color:var(--rose)}
button:disabled{opacity:.5}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.ped{display:grid;grid-template-columns:120px 1fr;gap:14px}
@media (max-width:520px){.ped{grid-template-columns:1fr}}
.ped img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#0003;cursor:zoom-in}
.ped .nofoto{aspect-ratio:1;border-radius:12px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2);text-align:center;padding:8px}
.meta{font-size:13px;color:var(--ink-2)}.meta b{color:var(--ink)}
.pill{display:inline-block;background:var(--sky);color:var(--sky-ink);font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px}
.msg{padding:10px 12px;border-radius:12px;background:var(--sky);color:var(--sky-ink);font-size:14px;margin:10px 0}
.msg.err{background:#FFDDE4;color:#8F1F3A}
.links a{font-size:13px;color:var(--sky-ink);margin-right:12px}
.big{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}.big.on{display:flex}.big img{max-width:100%;max-height:100%;border-radius:12px}
</style>
</head>
<body>
<main>
  <h1>Equipe WePill</h1>
  <p class="sub">Remédios que os clientes não acharam. Confira a foto, complete os dados e aprove: o remédio passa a aparecer para todos no app.</p>
  <div id="app"><p class="sub">Carregando…</p></div>
</main>
<div class="big" id="big"><img alt=""></div>
<script src="app/supabase.js"></script>
<script>
const SBURL='https://bdltkeymohiegmiyneka.supabase.co',SBKEY='sb_publishable_bONMbFwORbfrHz1Fe3XUpQ_uStVdhhx';
const sb=supabase.createClient(SBURL,SBKEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'wepill-auth-br',detectSessionInUrl:false,lock:async(n,t,fn)=>await fn()}});
const $=s=>document.querySelector(s),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['remedio','Remédio'],['suplemento','Suplemento'],['vitamina','Vitamina'],['fito','Fitoterápico']];
let ST={user:null,step:'email',email:'',tab:'pend',rows:[],msg:'',err:''};
function guess(r){const s=(r.sugestoes||r.nome||'').split(' | ')[0]||'';const m=s.match(/^(.*?)\s+(\d[\d.,]*\s*(?:mcg|mg|ml|ui|g|%)(?:\s*\+\s*\d[\d.,]*\s*(?:mcg|mg|ml|ui|g|%))?)/i);const sub=(s.match(/\(([^)]+)\)/)||[])[1]||'';
  return {nome:r.nome&&r.aprovado?r.nome:(m?m[1]:s.replace(/\s*\(.*$/,'').replace(/\s*·.*$/,'')).trim(),dose:r.dose||(m?m[2]:''),sub:r.substancia||sub}}
function view(){const A=$('#app');const M=(ST.msg?`<div class="msg">${esc(ST.msg)}</div>`:'')+(ST.err?`<div class="msg err">${esc(ST.err)}</div>`:'');
  if(!ST.user){A.innerHTML=M+(ST.step==='email'?`<div class="card"><label for="em">Seu e-mail da equipe</label><input id="em" type="email" autocomplete="email" value="${esc(ST.email)}"><div class="row" style="margin-top:10px"><button class="pri" data-a="send">Receber código</button></div></div>`
    :`<div class="card"><p class="sub">Mandamos um código para <b>${esc(ST.email)}</b>.</p><label for="cd">Código</label><input id="cd" inputmode="numeric" autocomplete="one-time-code"><div class="row" style="margin-top:10px"><button class="pri" data-a="verify">Entrar</button><button data-a="back">Trocar e-mail</button></div></div>`);return}
  const T=`<div class="tabs"><button class="${ST.tab==='pend'?'on':''}" data-a="tab" data-t="pend">Pedidos</button><button class="${ST.tab==='ok'?'on':''}" data-a="tab" data-t="ok">Aprovados</button></div>`;
  const rows=ST.rows.map(r=>{const g=guess(r);return `<div class="card" data-id="${r.id}"><div class="ped">
    ${r.foto?`<img src="${esc(r.foto)}" alt="Foto da caixa" data-a="zoom">`:`<div class="nofoto">Sem foto</div>`}
    <div><div class="meta">${r.aprovado?'<span class="pill">Aprovado</span>':`<span class="pill">${r.pedidos} pedido${r.pedidos>1?'s':''}</span>`} ${r.codigo?'· código <b>'+esc(r.codigo)+'</b>':'· sem código'} · ${new Date(r.criado).toLocaleDateString('pt-BR')}</div>
    ${r.sugestoes?`<div class="meta" style="margin-top:4px">Cliente escolheu: <b>${esc(r.sugestoes)}</b></div>`:''}
    <div class="links" style="margin-top:6px">${r.codigo?`<a href="https://www.google.com/search?q=${encodeURIComponent(r.codigo)}" target="_blank" rel="noopener">Procurar o código no Google</a>`:''}${g.nome?`<a href="https://consultas.anvisa.gov.br/#/bulario/q/?nomeProduto=${encodeURIComponent(g.nome.toUpperCase())}" target="_blank" rel="noopener">Bulário Anvisa</a>`:''}</div>
    <div class="row"><div><label>Nome</label><input data-f="nome" value="${esc(g.nome)}"></div><div><label>Dose</label><input data-f="dose" value="${esc(g.dose)}" placeholder="ex.: 50 mg"></div></div>
    <div class="row"><div><label>Substância</label><input data-f="sub" value="${esc(g.sub)}" placeholder="ex.: losartana potássica"></div><div><label>Categoria</label><select data-f="cat">${CATS.map(([k,l])=>`<option value="${k}" ${r.cat===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="row" style="margin-top:12px"><button class="pri" data-a="ok">${r.aprovado?'Salvar':'Aprovar'}</button><button class="del" data-a="del">${r.aprovado?'Tirar da base':'Apagar pedido'}</button></div></div></div></div>`}).join('');
  A.innerHTML=M+T+(rows||`<div class="card"><p class="sub" style="margin:0">${ST.tab==='pend'?'Nenhum pedido agora.':'Nada aprovado ainda.'}</p></div>`)+`<p class="sub" style="margin-top:20px">Entrou como ${esc(ST.user.email)} · <a href="#" data-a="out">sair</a></p>`}
async function load(){ST.err='';try{const {data,error}=await sb.rpc(ST.tab==='pend'?'remedios_pendentes':'remedios_aprovados');if(error)throw error;ST.rows=data||[]}catch(e){ST.rows=[];ST.err=/equipe/i.test(e.message||'')?'Este e-mail ainda não está na equipe. Adicione com o comando do arquivo 08-remedios-extra.sql.':'Não consegui carregar: '+(e.message||e)}view()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;ST.msg='';ST.err='';
  if(a==='zoom'){$('#big img').src=b.src;$('#big').classList.add('on');return}
  if(a==='send'){ST.email=($('#em').value||'').trim().toLowerCase();if(!ST.email)return;b.disabled=true;const {error}=await sb.auth.signInWithOtp({email:ST.email,options:{shouldCreateUser:false}});if(error){ST.err='Não consegui mandar o código: '+error.message;return view()}ST.step='code';view();setTimeout(()=>$('#cd')&&$('#cd').focus(),50);return}
  if(a==='verify'){const c=($('#cd').value||'').replace(/\D/g,'');b.disabled=true;const {data,error}=await sb.auth.verifyOtp({email:ST.email,token:c,type:'email'});if(error){ST.err='Código inválido ou vencido.';return view()}ST.user=data.user;return load()}
  if(a==='back'){ST.step='email';return view()}
  if(a==='out'){e.preventDefault();await sb.auth.signOut();ST.user=null;ST.step='email';return view()}
  if(a==='tab'){ST.tab=b.dataset.t;return load()}
  const card=b.closest('[data-id]');if(!card)return;const id=+card.dataset.id,f=k=>card.querySelector(`[data-f="${k}"]`).value.trim();
  if(a==='ok'){if(!f('nome')){ST.err='Falta o nome.';return view()}b.disabled=true;const {error}=await sb.rpc('remedio_aprovar',{p_id:id,p_nome:f('nome'),p_dose:f('dose'),p_substancia:f('sub'),p_cat:f('cat')});if(error){ST.err=error.message;return view()}ST.msg='Salvo. Em até 6 horas aparece para todos no app.';return load()}
  if(a==='del'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='Toque de novo para confirmar';return}const {error}=await sb.rpc('remedio_apagar',{p_id:id});if(error){ST.err=error.message;return view()}ST.msg='Apagado.';return load()}});
$('#big').addEventListener('click',()=>$('#big').classList.remove('on'));
sb.auth.getSession().then(({data})=>{ST.user=data.session&&data.session.user||null;ST.user?load():view()}).catch(()=>view());
</script>
</body>
</html>
